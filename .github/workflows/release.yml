name: Release

on:
  push:
    tags: ["v*"]
  # Lets a build be exercised without cutting a tag first.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - run: npm ci

      # Goes through scripts/build-release.mjs, which keeps the build machine's
      # paths out of the binary - see that file for why. It also typechecks
      # first, because tauri.conf.json runs `npm run build` before bundling, so
      # a release can never be cut from code that does not compile.
      - name: Build the installer
        run: npm run tauri:build

      - name: Find the installer
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *-setup.exe |
            Select-Object -First 1
          if (-not $exe) { throw "No NSIS installer was produced." }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # Created here rather than by hand, so a tag push is the whole
          # release procedure and there is no step left to forget.
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --title $tag --generate-notes
          }
          gh release upload $tag "${{ steps.installer.outputs.path }}" --clobber

      # On a manual run there is no tag to attach to, so the build is kept as
      # an artifact instead of being thrown away.
      - name: Keep the build
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.installer.outputs.name }}
          path: ${{ steps.installer.outputs.path }}
